name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

jobs:
  package:
    name: Verify, package, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and source
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git diff --exit-code "$RELEASE_TAG" -- . \
              ':(exclude).github/workflows/release.yml'
          fi
          npm ci --ignore-scripts
          npm run verify
      - name: Build release artifacts and SBOM
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          packed_name="$(npm pack --ignore-scripts --silent --pack-destination release)"
          mv "release/$packed_name" "release/mandatebound-$package_version.tgz"
          npm sbom --package-lock-only --omit=dev --sbom-format=spdx --sbom-type=library \
            > "release/mandatebound-$package_version.spdx.json"
          (
            cd release
            sha256sum "mandatebound-$package_version.tgz" \
              "mandatebound-$package_version.spdx.json" > SHA256SUMS
          )
      - name: Attest package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release/mandatebound-${{ steps.package.outputs.version }}.tgz
      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release/mandatebound-${{ steps.package.outputs.version }}.tgz
          sbom-path: release/mandatebound-${{ steps.package.outputs.version }}.spdx.json
      - name: Upload immutable release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/*

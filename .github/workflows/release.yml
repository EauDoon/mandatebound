name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover
        required: true
        type: string

# Nothing runs with write access by default. Only the publish job, which
# installs nothing and runs no repository code, receives the release, OIDC and
# attestation scopes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify release tag, versions and source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git diff --exit-code "$RELEASE_TAG" -- . \
              ':(exclude).github/workflows/release.yml'
          fi
          node scripts/version.mjs check --tag "$RELEASE_TAG"
          npm ci --ignore-scripts
          npm run verify
      - name: Build release artifacts and SBOM
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          packed_name="$(npm pack --ignore-scripts --silent --pack-destination release)"
          mv "release/$packed_name" "release/mandatebound-$package_version.tgz"
          npm sbom --package-lock-only --omit=dev --sbom-format=spdx --sbom-type=library \
            > "release/mandatebound-$package_version.spdx.json"
          (
            cd release
            sha256sum "mandatebound-$package_version.tgz" \
              "mandatebound-$package_version.spdx.json" > SHA256SUMS
          )
      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attest and upload
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files against their checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/mandatebound-${{ needs.build.outputs.version }}.tgz
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/mandatebound-${{ needs.build.outputs.version }}.tgz
          sbom-path: release/mandatebound-${{ needs.build.outputs.version }}.spdx.json
      # No checkout in this job, so gh must be told which repository to use.
      - name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first, and separately: a lint, licence, advisory or type
  # failure is reported in seconds instead of after the coverage run, and the
  # two gates are attributable to distinct jobs in the PR checks list.
  static:
    name: Static checks, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24.18.0, 26.11.1]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run lint, licence, advisory and type checks
        run: npm run verify:static

  # The expensive half only runs once every static leg passed, so a formatting
  # slip costs a few seconds of CI rather than a full coverage run.
  verify:
    name: Coverage and packaging, Node ${{ matrix.node }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24.18.0, 26.11.1]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the coverage, example and packaging gate
        run: npm run verify:build

  windows:
    name: Windows full suite and package, Node 22.12.0
    needs: static
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      # The whole suite, not a store and CLI subset: Windows is a declared
      # target, and tests that cannot run here (symlinks without privilege,
      # POSIX signals and FIFOs) skip themselves explicitly.
      - name: Build and run the full test suite
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test
      - name: Check the installed package in a path with spaces
        run: npm run package:check
